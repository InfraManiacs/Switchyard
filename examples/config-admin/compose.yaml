services:
  switchyard:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: switchyard-server:config-admin
    command:
      - --config
      - /config/switchyard.toml
      - --host
      - 0.0.0.0
      - --admin-token
      - ${SWITCHYARD_ADMIN_TOKEN:-local-dev-token}
      - --admin-persist
    volumes:
      # The DIRECTORY is mounted, not the file. --admin-persist writes a
      # temporary file beside the config and renames it over the original, so a
      # stopped process cannot leave a half-written config behind. That needs a
      # writable directory, and renaming over a single-file bind mount does not
      # work in any case.
      - ./config:/config
    healthcheck:
      # The server image ships no curl or wget. bash is present, so its
      # /dev/tcp support is what makes a real HTTP check possible here.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4000 &&
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q 200
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
    depends_on:
      mock-upstream:
        condition: service_started

  mock-upstream:
    image: python:3.13-slim
    command: ["python", "/app/app.py"]
    volumes:
      - ./mock-upstream:/app:ro

  ui:
    # The same image the Kubernetes deployment runs, built from ./ui. Building
    # it here rather than mounting a plain nginx means the thing under test is
    # the thing that ships.
    build:
      context: ./ui
    image: switchyard-admin-ui:config-admin
    environment:
      SWITCHYARD_UPSTREAM: http://switchyard:4000
    ports:
      - "127.0.0.1:${ADMIN_UI_PORT:-8080}:8080"
    volumes:
      # The two page files are mounted over the built copies so an edit shows
      # up on refresh. Everything else about the container stays as built.
      - ./ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui/app.js:/usr/share/nginx/html/app.js:ro
    depends_on:
      switchyard:
        condition: service_healthy

networks:
  default:
    name: ${CONFIG_ADMIN_NETWORK:-switchyard-config-admin}
